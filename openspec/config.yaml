# Configuración SDD de Beim-System-Tech
schema: spec-driven

context: |
  Proyecto TypeScript con pnpm 11.3.0 y Turborepo. El workspace moderno
  observado es apps/* y actualmente contiene apps/gestion. pagina-web/ y
  sistema-gestion/ son sistemas heredados de referencia. La web pública, la
  web de gestión consolidada, el API moderno, el backend separado y la base de
  datos canónica son objetivos futuros hasta contar con evidencia verificable.
  Los documentos técnicos nuevos se escriben en español técnico neutro.

testing:
  strict_tdd: true
  strict_tdd_note: >-
    Vitest está configurado y el proyecto debe mantener el ciclo de pruebas
    antes de cambios de comportamiento. La cobertura actual no representa al
    sistema completo.
  runner:
    command: 'pnpm test'
    framework: 'Vitest'
  layers:
    unit: 'Vitest en apps/gestion y pruebas enfocadas heredadas'
    integration: 'No se observa un arnés dedicado de API, backend y base de datos'
    e2e: 'No se observa una suite E2E'
  coverage:
    command: ''
    available: false
  quality:
    linter: 'eslint mediante pnpm lint'
    typechecker: 'tsc mediante pnpm typecheck'
    formatter: 'prettier mediante pnpm format; no usarlo como comprobación mutante'

rules:
  language: 'Los artefactos técnicos se escriben en español técnico neutro cuando la tarea lo solicita.'
  evidence:
    - 'Usar Línea base observada, Comportamiento de referencia y Objetivo futuro.'
    - 'No describir componentes ausentes, CI fallida o intención de despliegue como implementación.'
  documentation:
    - 'AGENTS.md es procedural; constitution.md es normativo; spec.md define comportamiento; plan.md define secuencia; tasks.md define evidencia.'
  safety:
    - 'No modificar código, bases de datos, semillas, Engram o .codegraph en un cambio documental.'
    - 'Todo mantenimiento destructivo requiere un cambio separado, alcance explícito y reversión.'
  proposal:
    - 'Incluir intención, alcance, riesgos y reversión.'
  specs:
    - 'Usar escenarios Given/When/Then y requisitos verificables.'
  design:
    - 'Documentar decisiones de arquitectura, propiedad y límites con su justificación.'
  tasks:
    - 'Agrupar por fase y mantener cada unidad acotada y verificable.'
  apply:
    guidelines:
      - 'Seguir AGENTS.md, constitution.md y las tareas aprobadas.'
    tdd: true
    test_command: 'pnpm test'
  verify:
    test_command: 'pnpm test'
    build_command: 'pnpm build'
    coverage_threshold: 0
  archive:
    - 'Advertir antes de combinar cambios destructivos y conservar el historial.'
