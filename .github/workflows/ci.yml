# CI Quality Gates — Beim monorepo (Turborepo + pnpm 11.3.0)
#
# Pipeline: install -> quality (lint + typecheck) -> test -> build.
# Runs on push to `main` and on pull requests targeting `main`.
#
# Env requirements:
#   - DATABASE_URL is a CI-only placeholder. turbo.json declares it as a
#     globalEnv and prisma generate needs it at resolution time, but generate
#     never connects (no live DB in CI).
#   - .env is gitignored, so DATABASE_URL must be injected via workflow env.
#
# Repo-admin step (out of YAML scope): once green on `main`, enable branch
# protection and mark install, quality, test, build as required status checks
# for PRs targeting `main`.

name: CI Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  DATABASE_URL: postgresql://localhost:5432/dummy
  NODE_ENV: production

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Enable corepack and assert pinned pnpm
        run: corepack enable && pnpm --version
      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile
      # TODO(future-prisma): re-enable when a Prisma schema exists.
      # Próxima implementación: no hay schema.prisma ni script `generate` en el
      # repo (la app persiste en JSON); este step se reactiva con la migración a Postgres.
      # - name: Generate Prisma client (offline, placeholder URL)
      #   run: pnpm generate
      - name: Upload shared workspace (node_modules + turbo cache)
        uses: actions/upload-artifact@v4
        with:
          name: workspace
          path: |
            node_modules
            .turbo/cache
          retention-days: 1
          include-hidden-files: true

  quality:
    runs-on: ubuntu-latest
    needs: install
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Cada job corre en una VM nueva: sin este setup no existe ni node ni pnpm
      # (el artefacto solo trae node_modules, no los binarios). Ver run 33984736413.
      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: workspace
          path: .
      # upload/download-artifact no conserva el bit ejecutable Unix: los
      # binarios nativos empaquetados (turbo, esbuild, ...) llegan sin +x y
      # fallan con EACCES al hacer spawn. `pnpm install` no lo repara porque
      # el lockfile no cambia y pnpm omite el reenlace ("Already up to date",
      # run 33985378493). Se restaura +x en todo bin/ empaquetado en vez de
      # un path pineado por herramienta (frágil ante pins exactos).
      - name: Restore executable bits lost in artifact transfer
        run: find node_modules/.pnpm -type f -path '*/bin/*' -exec chmod +x {} +
      - name: Lint and typecheck
        run: pnpm lint && pnpm typecheck

  test:
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Cada job corre en una VM nueva: sin este setup no existe ni node ni pnpm
      # (el artefacto solo trae node_modules, no los binarios). Ver run 33984736413.
      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: workspace
          path: .
      # Ver comentario en quality: el artefacto viaja sin bit ejecutable.
      - name: Restore executable bits lost in artifact transfer
        run: find node_modules/.pnpm -type f -path '*/bin/*' -exec chmod +x {} +
      - name: Run tests (offline, DB-free)
        # NODE_ENV=test: el global `production` sirve el build prod de
        # react-dom sin `act` y rompe los tests RTL (run 33988570056).
        env:
          NODE_ENV: test
        run: pnpm test

  build:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Cada job corre en una VM nueva: sin este setup no existe ni node ni pnpm
      # (el artefacto solo trae node_modules, no los binarios). Ver run 33984736413.
      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: workspace
          path: .
      # Ver comentario en quality: el artefacto viaja sin bit ejecutable.
      - name: Restore executable bits lost in artifact transfer
        run: find node_modules/.pnpm -type f -path '*/bin/*' -exec chmod +x {} +
      - name: Build all workspaces (offline)
        run: pnpm build
