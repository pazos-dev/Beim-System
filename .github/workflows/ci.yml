# CI Quality Gates — Beim monorepo (Turborepo + pnpm 11.3.0)
#
# Pipeline: install -> quality (lint + typecheck) -> test -> build.
# Runs on push to `main` and on pull requests targeting `main`.
#
# Env requirements:
#   - DATABASE_URL is a CI-only placeholder. turbo.json declares it as a
#     globalEnv and prisma generate needs it at resolution time, but generate
#     never connects (no live DB in CI).
#   - .env is gitignored, so DATABASE_URL must be injected via workflow env.
#
# Repo-admin step (out of YAML scope): once green on `main`, enable branch
# protection and mark install, quality, test, build as required status checks
# for PRs targeting `main`.

name: CI Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  DATABASE_URL: postgresql://localhost:5432/dummy
  NODE_ENV: production

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Enable corepack and assert pinned pnpm
        run: corepack enable && pnpm --version
      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile
      # NOTA: node_modules NO viaja entre jobs vía artefactos. upload-artifact
      # materializa los symlinks de pnpm en copias reales y duplica instancias
      # de React (dispatcher null en suites RTL, run 33990042691); cada job
      # reinstala en fresco con el mismo lockfile pineado.
      # TODO(future-prisma): re-enable when a Prisma schema exists.
      # Próxima implementación: no hay schema.prisma ni script `generate` en el
      # repo (la app persiste en JSON); este step se reactiva con la migración a Postgres.
      # - name: Generate Prisma client (offline, placeholder URL)
      #   run: pnpm generate

  quality:
    runs-on: ubuntu-latest
    needs: install
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Cada job corre en una VM nueva: sin este setup no existe ni node ni pnpm.
      # Ver run 33984736413.
      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # Instalación en fresco (ver NOTA en install): el artefacto con
      # node_modules rompía los symlinks de pnpm. Además deja sin efecto el
      # workaround de chmod +x, que trataba ese mismo síntoma (run 33985378493).
      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Lint and typecheck
        run: pnpm lint && pnpm typecheck

  test:
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Cada job corre en una VM nueva: sin este setup no existe ni node ni pnpm.
      # Ver run 33984736413.
      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # Instalación en fresco (ver NOTA en install): el artefacto con
      # node_modules rompía los symlinks de pnpm. Además deja sin efecto el
      # workaround de chmod +x, que trataba ese mismo síntoma (run 33985378493).
      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Run tests (offline, DB-free)
        # NODE_ENV=test: el global `production` sirve el build prod de
        # react-dom sin `act` y rompe los tests RTL (run 33988570056).
        env:
          NODE_ENV: test
        run: pnpm test

  build:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Cada job corre en una VM nueva: sin este setup no existe ni node ni pnpm.
      # Ver run 33984736413.
      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # Instalación en fresco (ver NOTA en install): el artefacto con
      # node_modules rompía los symlinks de pnpm. Además deja sin efecto el
      # workaround de chmod +x, que trataba ese mismo síntoma (run 33985378493).
      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Build all workspaces (offline)
        run: pnpm build
